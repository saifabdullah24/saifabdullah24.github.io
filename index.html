  <style>
    :root {
      --ink: #1d1d1f;
      --ink-2: #6e6e73;
      --line: #d2d2d7;
      --bg: #ffffff;
      --bg-alt: #f5f5f7;
      --blue: #0071e3;
      --nav-h: 52px;
      --maxw: 980px;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
              "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: var(--nav-h);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      line-height: 1.47;
      letter-spacing: -0.01em;
      overflow-x: hidden;
    }

    /* ---------- Navigation ---------- */
    header {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: var(--nav-h);
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      z-index: 9999;
    }

    nav {
      max-width: var(--maxw);
      height: 100%;
      margin: 0 auto;
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .nav-home {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
      text-decoration: none;
      color: var(--ink);
      white-space: nowrap;
      opacity: 0.9;
      transition: opacity 0.2s ease;
    }
    .nav-home:hover { opacity: 0.55; }
    .nav-home svg { width: 15px; height: 15px; flex: none; }

    .nav-links { display: flex; align-items: center; gap: 1.5rem; }

    .nav-links a {
      font-size: 12.5px;
      font-weight: 400;
      color: var(--ink);
      text-decoration: none;
      opacity: 0.85;
      cursor: pointer;
      transition: opacity 0.2s ease;
      white-space: nowrap;
    }
    .nav-links a:hover { opacity: 0.5; }

    .lang {
      display: inline-flex;
      align-items: center;
      border: 1px solid rgba(0,0,0,0.16);
      border-radius: 980px;
      overflow: hidden;
      flex: none;
    }

    .lang button {
      appearance: none;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--ink-2);
      padding: 4px 10px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .lang button.active { background: var(--ink); color: #fff; }

    @media (max-width: 900px) {
      .nav-links { gap: 0.95rem; overflow-x: auto; scrollbar-width: none; }
      .nav-links::-webkit-scrollbar { display: none; }
      .nav-home span { display: none; }
    }

    /* ---------- Hero ---------- */
    .hero {
      margin-top: var(--nav-h);
      padding: clamp(56px, 8vw, 96px) 22px clamp(48px, 6vw, 72px);
      background: var(--bg);
      color: var(--ink);
      border-bottom: 1px solid var(--line);
    }

    .hero-inner {
      max-width: var(--maxw);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 210px;
      gap: 3rem;
      align-items: end;
    }

    @media (max-width: 720px) {
      .hero-inner { grid-template-columns: 1fr; gap: 2rem; align-items: start; }
    }

    .hero img.portrait {
      width: 100%;
      max-width: 200px;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      border-radius: 50%;
    }

    .hero h1 {
      font-size: clamp(46px, 8vw, 84px);
      line-height: 1.02;
      font-weight: 600;
      letter-spacing: -0.035em;
      margin-bottom: 1.1rem;
      color: var(--ink);
    }

    .hero .sub {
      font-size: clamp(18px, 2vw, 22px);
      font-weight: 400;
      color: var(--ink-2);
      max-width: 460px;
      margin: 0 0 2.2rem;
      letter-spacing: 0;
      line-height: 1.45;
    }

    .cta-row { display: flex; flex-wrap: wrap; gap: 0.8rem; justify-content: flex-start; }

    .btn {
      display: inline-block;
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 0;
      padding: 12px 24px;
      border-radius: 980px;
      text-decoration: none;
      border: 1px solid transparent;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.22s ease, color 0.22s ease, transform 0.22s ease;
    }

    .btn-primary { background: var(--blue); color: #fff; }
    .btn-primary:hover { background: #0077ed; transform: translateY(-1px); }

    .btn-ghost { background: transparent; color: var(--blue); border-color: rgba(0, 113, 227, 0.4); }
    .btn-ghost:hover { background: rgba(0, 113, 227, 0.07); transform: translateY(-1px); }

    /* ---------- Sections ---------- */
    section.band { padding: clamp(76px, 11vw, 132px) 22px; }
    section.band.alt { background: var(--bg-alt); }

    .wrap { max-width: var(--maxw); margin: 0 auto; }
    .wrap.narrow { max-width: 720px; }

    .kicker {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent, var(--ink-2));
      margin-bottom: 0.7rem;
    }

    h2.title {
      font-size: clamp(34px, 5.2vw, 56px);
      line-height: 1.07;
      font-weight: 600;
      letter-spacing: -0.028em;
      margin-bottom: 2.4rem;
      background: linear-gradient(100deg, var(--g1, #1d1d1f) 0%, var(--g2, #1d1d1f) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      width: fit-content;
      max-width: 100%;
    }

    /* Apple-Farbwelt pro Sektion */
    #ueber    { --g1: #0071e3; --g2: #5e5ce6; --accent: #0071e3; }
    #staerken { --g1: #8944ab; --g2: #d4145a; --accent: #a53d9c; }
    #projekt  { --g1: #007d8f; --g2: #0071e3; --accent: #00808f; }
    #kontakt  { --g1: #00875a; --g2: #007d8f; --accent: #00875a; }

    .prose p {
      font-size: 19px;
      line-height: 1.65;
      letter-spacing: -0.01em;
      margin-bottom: 1.5rem;
      color: var(--ink);
    }
    .prose p:last-child { margin-bottom: 0; }
    .prose .lead { font-size: 19px; font-weight: 400; }

    /* Unterschrift */
    .signature {
      margin-top: 2.6rem;
      padding-top: 1.8rem;
      border-top: 1px solid var(--line);
    }

    .signature img {
      display: block;
      height: 62px;
      width: auto;
      opacity: 0.9;
    }

    /* ---------- Stärken-Karten ---------- */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.2rem;
    }

    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 1.8rem 1.7rem;
    }

    .card .num {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--accent);
      margin-bottom: 0.9rem;
    }

    .card h3 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.6rem;
    }

    .card p {
      font-size: 16px;
      line-height: 1.6;
      color: var(--ink-2);
    }

    /* ---------- Projekt ---------- */
    .proj-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2.5rem;
      align-items: start;
    }
    @media (max-width: 760px) { .proj-grid { grid-template-columns: 1fr; gap: 1.8rem; } }

    .tech-list { border-top: 1px solid var(--line); }

    .tech-row {
      display: grid;
      grid-template-columns: 130px 1fr;
      gap: 1rem;
      padding: 0.85rem 0;
      border-bottom: 1px solid var(--line);
      font-size: 16px;
    }
    .tech-row dt { color: var(--ink-2); font-size: 14px; padding-top: 2px; }
    @media (max-width: 520px) { .tech-row { grid-template-columns: 1fr; gap: 0.2rem; } }

    /* ---------- Kontakt ---------- */
    .contact-list { border-top: 1px solid var(--line); }

    .contact-row {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 1.5rem;
      align-items: baseline;
      padding: 1.5rem 0;
      border-bottom: 1px solid var(--line);
    }

    .contact-row dt {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--accent, var(--ink-2));
    }

    .contact-row dd { font-size: 20px; line-height: 1.5; color: var(--ink); }
    .contact-row dd a { color: inherit; text-decoration: none; }
    .contact-row dd a:hover { color: var(--blue); }
    .contact-row dd .note { display: block; font-size: 15px; color: var(--ink-2); margin-top: 0.3rem; }

    @media (max-width: 600px) { .contact-row { grid-template-columns: 1fr; gap: 0.4rem; } }

    footer {
      background: var(--bg-alt);
      border-top: 1px solid var(--line);
      padding: 2.2rem 22px;
      text-align: center;
      font-size: 12px;
      color: var(--ink-2);
    }

    /* ---------- Reveal ---------- */
    .reveal {
      opacity: 0;
      transform: translateY(26px);
      transition: opacity 0.85s cubic-bezier(0.28, 0.11, 0.32, 1),
                  transform 0.85s cubic-bezier(0.28, 0.11, 0.32, 1);
    }
    .reveal.in { opacity: 1; transform: none; }

    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; transform: none; transition: none; }
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>

<script>
/* ==========================================================================
   TEXTE — hier ändern. Sonst nichts anfassen.

   - Jeder Absatz steht zwischen "..." und endet mit Komma
   - Zeilenumbruch:  <br>      Fettschrift: <strong>Text</strong>
   - Erster Absatz gross:  { lead: "..." }
   ========================================================================== */

const TEXTE = {

  /* ---------- ÜBER MICH ---------- */
  ueber: {
    de: [
      { lead: "Im Praktikum bei dPlan habe ich zum ersten Mal Kunden angerufen und Bestellungen ausgelöst. Da wurde mir klar, dass ich eine kaufmännische Lehre machen will." },

      "Meine Aufgabe dort war es, Laptops einzurichten und für den Versand vorzubereiten. Dazu kamen Telefonate mit Kunden, Bestellungen und die Absprache mit dem Team. Diese Mischung aus Kundenkontakt und Organisation gefällt mir.",

      "Nach der Sekundarschule habe ich das Berufsvorbereitungsjahr Technik und Informatik besucht. Danach begann ich das Basisjahr der Fachmittelschule. Dort merkte ich, dass mir der schulische Weg zu wenig Praxis bietet. Ich arbeite lieber in einem Betrieb und sehe, wofür meine Arbeit gebraucht wird. Seit März besuche ich deshalb das Brückenangebot JOB PLUS.",

      "In meiner Freizeit gehe ich ins Fitnessstudio, spiele Fussball und koche gerne. Ausserdem programmiere ich. Diese Website habe ich selbst gebaut."
    ],

    en: [
      { lead: "During my internship at dPlan I called customers and placed orders for the first time. That is when I knew I wanted to do a commercial apprenticeship." },

      "My job there was to set up laptops and prepare them for shipping. I also called customers, took orders and coordinated with the team. I enjoy this mix of customer contact and organisation.",

      "After secondary school I attended the pre-apprenticeship year for technology and IT. I then started the foundation year at the FMS school. There I noticed that a school-based path offers me too little practical work. I would rather work in a company and see what my work is needed for. Since March I have therefore been attending the JOB PLUS bridge-year programme.",

      "In my free time I go to the gym, play football and enjoy cooking. I also do some programming. I built this website myself."
    ]
  },

  /* ---------- WAS ICH MITBRINGE (Karten) ---------- */
  staerken: {
    de: [
      { t: "Kundenkontakt",
        p: "Im Praktikum bei dPlan habe ich Kunden telefonisch betreut, Bestellungen aufgenommen und selbstständig ausgelöst. Bei Dosenbach im ShopVille habe ich beraten, verkauft und die Ware bewirtschaftet." },

      { t: "Sorgfalt",
        p: "Vor dem Versand habe ich Laptops eingerichtet, Updates eingespielt und geprüft, ob alles vollständig ist. Bei solchen Aufgaben fällt jeder Fehler beim Kunden auf. Genau arbeiten ist für mich deshalb selbstverständlich." },

      { t: "Selbstständigkeit",
        p: "Wenn ich etwas erreichen will, fange ich selber an. Auf die BMS-Aufnahmeprüfung bereite ich mich in meiner Freizeit vor, meine Bewerbungsunterlagen gestalte ich selbst und diese Website habe ich zu Hause von Grund auf geschrieben." },

      { t: "Sprachen",
        p: "Deutsch als Erstsprache, Bengalisch und Englisch als Muttersprachen, Französisch in Grundkenntnissen. Im Kundenkontakt hilft mir das täglich." }
    ],

    en: [
      { t: "Customer contact",
        p: "During my internship at dPlan I looked after customers by phone, took orders and placed them independently. At Dosenbach in ShopVille I advised customers, sold products and managed stock." },

      { t: "Accuracy",
        p: "Before shipping, I set up laptops, installed updates and checked whether everything was complete. With tasks like these, every mistake shows up at the customer. Working carefully is therefore a given for me." },

      { t: "Working independently",
        p: "When I want to achieve something, I start on my own. I am preparing for the BMS entrance exam in my free time, I design my application documents myself, and I wrote this website from scratch at home." },

      { t: "Languages",
        p: "German as my first language, Bengali and English as mother tongues, and basic French. In customer contact this helps me every day." }
    ]
  },

  /* ---------- DIESE WEBSITE ---------- */
  projekt: {
    de: [
      "Ich habe diese Seite selbst in HTML, CSS und JavaScript geschrieben und über GitHub veröffentlicht. Es steckt keine fertige Vorlage dahinter.",

      "Angefangen hat es im Berufsvorbereitungsjahr, wo wir mit HTML und CSS gearbeitet haben. Danach habe ich zu Hause weitergemacht. Den Sprachumschalter oben rechts, das Layout und die Farben habe ich selbst gebaut.",

      "Programmieren ist für mich ein Hobby und kein Berufsziel. Es zeigt aber, wie ich arbeite. Ich probiere aus, suche Fehler, bis etwas funktioniert, und bleibe dran, auch wenn es niemand von mir verlangt."
    ],

    en: [
      "I wrote this page myself in HTML, CSS and JavaScript and published it through GitHub. There is no ready-made template behind it.",

      "It started during my pre-apprenticeship year, where we worked with HTML and CSS. After that I kept going at home. I built the language switch in the top right, the layout and the colours myself.",

      "Programming is a hobby for me and not a career goal. But it shows how I work. I try things out, look for mistakes until something works, and stick with it even when nobody asks me to."
    ]
  }
};

/* ==========================================================================
   Ab hier nichts mehr ändern.
   ========================================================================== */

function baueText(absaetze) {
  return absaetze.map(a => {
    if (typeof a === "string") return "<p>" + a + "</p>";
    if (a.lead !== undefined)  return '<p class="lead">' + a.lead + "</p>";
    return "";
  }).join("");
}

function baueKarten(karten) {
  return karten.map((k, i) =>
    '<div class="card"><div class="num">' + String(i + 1).padStart(2, "0") + '</div>'
    + "<h3>" + k.t + "</h3><p>" + k.p + "</p></div>"
  ).join("");
}

function setLang(lang) {
  document.documentElement.lang = lang;
  document.title = "Saif Abdullah";

  document.querySelectorAll("[data-de][data-en]").forEach(el => {
    const val = el.getAttribute("data-" + lang);
    if (val !== null) el.innerHTML = val;
  });

  document.getElementById("text-ueber").innerHTML     = baueText(TEXTE.ueber[lang]);
  document.getElementById("text-projekt").innerHTML   = baueText(TEXTE.projekt[lang]);
  document.getElementById("cards-staerken").innerHTML = baueKarten(TEXTE.staerken[lang]);

  document.getElementById("btn-de").classList.toggle("active", lang === "de");
  document.getElementById("btn-en").classList.toggle("active", lang === "en");
}

setLang("de");

(function () {
  const els = document.querySelectorAll(".reveal");
  if (!("IntersectionObserver" in window)) {
    els.forEach(el => el.classList.add("in"));
    return;
  }
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
    });
  }, { threshold: 0.12, rootMargin: "0px 0px -60px 0px" });
  els.forEach(el => io.observe(el));
})();
</script>
