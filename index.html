  <style>
    :root {
      --paper:   #F2F0EA;
      --paper-2: #E8E5DC;
      --ink:     #131313;
      --ink-2:   #5C5952;
      --ink-3:   #8E8A82;
      --rule:    rgba(19, 19, 19, 0.15);
      --blue:    #2346C8;   /* Kugelschreiber-Blau, wie die Unterschrift */

      --pad:   clamp(16px, 3.4vw, 48px);
      --gap:   clamp(12px, 2vw, 28px);
      --nav-h: 60px;

      --sans:  "Schibsted Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --serif: "Newsreader", Georgia, "Times New Roman", serif;
      --ease:  cubic-bezier(0.2, 0.7, 0.1, 1);
      color-scheme: light;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      scroll-padding-top: var(--nav-h);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    /* Lenis */
    html.lenis, html.lenis body { height: auto; }
    .lenis.lenis-smooth { scroll-behavior: auto !important; }
    .lenis.lenis-stopped { overflow: clip; }

    body {
      font-family: var(--sans);
      font-size: 17px;
      line-height: 1.55;
      color: var(--ink);
      background: var(--paper);
      overflow-x: hidden;
    }
    .sec-num, .s-num, .nav-links .n { font-variant-numeric: tabular-nums; }

    ::selection { background: var(--blue); color: var(--paper); }

    a { color: inherit; }
    img { display: block; max-width: 100%; }

    :focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 2px; }

    .js .hero { visibility: hidden; }

    /* ---------- Layout-Raster ---------- */
    .grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      column-gap: var(--gap);
    }

    .label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-3);
    }

    /* ---------- Navigation ---------- */
    header {
      position: fixed;
      inset: 0 0 auto 0;
      height: var(--nav-h);
      z-index: 50;
      padding: 0 var(--pad);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      background: rgba(242, 240, 234, 0);
      border-bottom: 1px solid transparent;
      transition: background 0.4s ease, border-color 0.4s ease;
    }
    header.scrolled {
      background: rgba(242, 240, 234, 0.86);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom-color: var(--rule);
    }

    .brand {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
      text-decoration: none;
      white-space: nowrap;
    }
    .brand span { color: var(--ink-3); font-weight: 500; }

    .nav-links { display: flex; gap: clamp(14px, 2.2vw, 30px); }
    .nav-links a {
      font-size: 14px;
      text-decoration: none;
      color: var(--ink-2);
      display: inline-flex;
      gap: 0.4em;
      transition: color 0.25s ease;
    }
    .nav-links a .n { font-size: 11px; color: var(--ink-3); padding-top: 0.15em; transition: color 0.25s ease; }
    .nav-links a:hover, .nav-links a.active { color: var(--ink); }
    .nav-links a.active .n { color: var(--blue); }

    .lang { display: flex; align-items: center; gap: 2px; font-size: 13px; }
    .lang button {
      appearance: none; border: 0; background: none; cursor: pointer;
      font: inherit; font-weight: 600; color: var(--ink-3);
      padding: 6px 6px; transition: color 0.2s ease;
    }
    .lang button.active { color: var(--ink); }
    .lang .slash { color: var(--ink-3); }

    @media (max-width: 960px) { .nav-links { display: none; } }

    /* ---------- Hero ---------- */
    .hero {
      min-height: 100svh;
      padding: calc(var(--nav-h) + clamp(24px, 5vh, 56px)) var(--pad) clamp(28px, 4vh, 44px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: clamp(32px, 6vh, 64px);
    }

    .hero-kicker { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }

    .hero-name {
      font-size: clamp(68px, 15.5vw, 248px);
      line-height: 0.92;
      font-weight: 700;
      letter-spacing: -0.055em;
      margin-left: -0.04em;
      will-change: transform;
    }
    .hero-name .portrait {
      display: inline-block;
      height: 0.9em;
      width: 0.9em;
      vertical-align: -0.1em;
      margin-left: 0.1em;
      border-radius: 50%;
      object-fit: cover;
    }

    .meta {
      position: relative;
      padding-top: 18px;
      row-gap: 22px;
    }
    .meta-rule {
      position: absolute; top: 0; left: 0; right: 0;
      height: 1px; background: var(--ink);
      transform-origin: left center;
    }
    .meta > div:not(.meta-rule) { grid-column: span 3; }
    .meta dt { margin-bottom: 6px; }
    .meta dd { font-size: clamp(16px, 1.45vw, 21px); font-weight: 500; line-height: 1.3; letter-spacing: -0.01em; }

    .hero-foot {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 2rem;
      flex-wrap: wrap;
    }
    .hero-foot p {
      max-width: 34ch;
      font-size: clamp(17px, 1.5vw, 21px);
      line-height: 1.4;
      color: var(--ink-2);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.75em;
      padding: 15px 22px 15px 24px;
      background: var(--ink);
      color: var(--paper);
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      isolation: isolate;
    }
    .btn::before {
      content: ""; position: absolute; inset: 0; z-index: -1;
      background: var(--blue);
      transform: translateY(101%);
      transition: transform 0.5s var(--ease);
    }
    .btn:hover::before { transform: none; }
    .btn .arrow { transition: transform 0.5s var(--ease); }
    .btn:hover .arrow { transform: translateX(4px); }

    @media (max-width: 860px) {
      .meta > div:not(.meta-rule) { grid-column: span 6; }
    }

    /* ---------- Sektionen ---------- */
    .sec {
      padding: clamp(96px, 13vw, 176px) var(--pad);
      border-top: 1px solid var(--rule);
    }

    .sec-head {
      grid-column: 1 / 4;
      align-self: start;
      position: sticky;
      top: calc(var(--nav-h) + 28px);
      display: flex;
      gap: 0.9rem;
      align-items: baseline;
    }
    .sec-num { font-size: 13px; font-weight: 700; color: var(--blue); }

    .sec-body { grid-column: 4 / 13; }

    .sec-title {
      font-size: clamp(38px, 5.6vw, 84px);
      line-height: 1;
      font-weight: 650;
      letter-spacing: -0.045em;
      max-width: 15ch;
      margin-bottom: clamp(40px, 6vw, 80px);
      text-wrap: balance;
    }

    @media (max-width: 860px) {
      .sec-head { grid-column: 1 / -1; position: static; margin-bottom: 28px; }
      .sec-body { grid-column: 1 / -1; }
    }

    /* ---------- Über mich ---------- */
    .about-cols { display: grid; grid-template-columns: minmax(0, 1fr); }

    .prose p {
      font-size: clamp(17px, 1.3vw, 19px);
      line-height: 1.7;
      color: var(--ink-2);
      max-width: 62ch;
    }
    .prose p + p { margin-top: 1.25em; }
    .prose p strong { color: var(--ink); font-weight: 600; }

    .prose .lead {
      font-family: var(--serif);
      font-style: italic;
      font-size: clamp(28px, 3.2vw, 48px);
      line-height: 1.18;
      letter-spacing: -0.015em;
      color: var(--ink);
      max-width: 26ch;
      margin-bottom: clamp(36px, 5vw, 64px);
    }
    .prose .lead + p { margin-top: 0; }

    .prose-cols {
      columns: 2 300px;
      column-gap: clamp(28px, 4vw, 64px);
    }
    .prose-cols p { break-inside: avoid; max-width: none; }

    .signature {
      margin-top: clamp(48px, 6vw, 80px);
      display: flex;
      align-items: end;
      gap: 1.4rem;
    }
    .signature img { height: clamp(56px, 6vw, 78px); width: auto; mix-blend-mode: multiply; }
    .signature .label { padding-bottom: 8px; }

    /* ---------- Praktikum ---------- */
    .intern-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem 2rem;
      flex-wrap: wrap;
      margin-bottom: clamp(40px, 5vw, 64px);
    }
    .intern-intro {
      font-size: clamp(19px, 1.7vw, 24px);
      line-height: 1.4;
      letter-spacing: -0.015em;
      max-width: 36ch;
    }
    .intern-when { color: var(--blue); white-space: nowrap; }

    .tasks {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(40px, 4.5vw, 64px) var(--gap);
    }
    @media (max-width: 760px) { .tasks { grid-template-columns: 1fr; } }

    .task-group h3 {
      font-size: clamp(20px, 1.8vw, 24px);
      font-weight: 600;
      letter-spacing: -0.025em;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--ink);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
    }
    .task-group h3 small { font-size: 12px; font-weight: 600; color: var(--ink-3); letter-spacing: 0.06em; }
    .task-group ul { list-style: none; }
    .task-group li {
      padding: 13px 0 13px 22px;
      border-bottom: 1px solid var(--rule);
      color: var(--ink-2);
      line-height: 1.5;
      position: relative;
    }
    .task-group li::before {
      content: "";
      position: absolute; left: 2px; top: 1.32em;
      width: 9px; height: 1px;
      background: var(--blue);
    }

    .tools {
      margin-top: clamp(48px, 6vw, 80px);
      display: flex;
      align-items: center;
      gap: 1rem 1.4rem;
      flex-wrap: wrap;
    }
    .tools ul { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; }
    .tools li {
      font-size: 14px;
      font-weight: 500;
      padding: 7px 14px;
      border: 1px solid var(--rule);
      border-radius: 999px;
    }

    /* ---------- Werdegang ---------- */
    .weg { list-style: none; position: relative; padding-left: 36px; }
    .weg-track {
      position: absolute; left: 5px; top: 10px; bottom: 10px;
      width: 1px; background: var(--rule);
    }
    .weg-fill {
      position: absolute; inset: 0;
      background: var(--blue);
      transform-origin: top center;
    }
    .weg-item {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr);
      gap: 0.4rem var(--gap);
      padding: 0 0 clamp(36px, 4.5vw, 56px);
    }
    .weg-item:last-child { padding-bottom: 0; }
    .weg-item .dot {
      position: absolute; left: -36px; top: 8px;
      width: 11px; height: 11px; border-radius: 50%;
      background: var(--paper);
      border: 1px solid var(--ink-3);
      transition: background 0.4s ease, border-color 0.4s ease, transform 0.4s var(--ease);
    }
    .weg-item.on .dot { background: var(--blue); border-color: var(--blue); }
    .weg-item.goal .dot { border-style: dashed; }
    .weg-item.goal.on .dot { background: var(--paper); border: 1px dashed var(--blue); transform: scale(1.5); }
    .weg-when { grid-column: 1 / -1; color: var(--blue); }
    .weg-item h3 {
      font-size: clamp(21px, 2vw, 28px);
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.025em;
    }
    .weg-item p { color: var(--ink-2); max-width: 46ch; padding-top: 0.2em; }

    @media (max-width: 640px) { .weg-item { grid-template-columns: 1fr; } }

    /* ---------- Stärken ---------- */
    .s-list { list-style: none; border-bottom: 1px solid var(--rule); }
    .s-row {
      position: relative;
      display: grid;
      grid-template-columns: 3.2rem minmax(0, 1fr);
      column-gap: var(--gap);
      padding: clamp(28px, 3.4vw, 44px) 0;
    }
    .s-body {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
      column-gap: var(--gap);
      align-items: start;
    }
    .s-row .rule {
      position: absolute; top: 0; left: 0; right: 0;
      height: 1px; background: var(--rule);
      transform-origin: left center;
    }
    .s-num { font-size: 13px; font-weight: 700; color: var(--ink-3); padding-top: 0.55em; transition: color 0.3s ease; }
    .s-title {
      font-size: clamp(26px, 2.8vw, 42px);
      font-weight: 600;
      line-height: 1.05;
      letter-spacing: -0.035em;
      transition: translate 0.6s var(--ease);
    }
    .s-text { color: var(--ink-2); max-width: 52ch; padding-top: 0.3em; }
    .s-row:hover .s-num { color: var(--blue); }
    .s-row:hover .s-title { translate: 10px 0; }

    @media (max-width: 900px) {
      .s-row { grid-template-columns: 2.4rem minmax(0, 1fr); }
      .s-body { display: block; }
      .s-title { margin-bottom: 18px; }
      .s-text { padding-top: 0; }
    }

    /* ---------- Diese Website ---------- */
    .proj-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
      gap: clamp(32px, 5vw, 80px);
      align-items: start;
    }
    @media (max-width: 900px) { .proj-grid { grid-template-columns: 1fr; } }

    .spec { border-top: 1px solid var(--ink); }
    .spec > div {
      display: grid;
      grid-template-columns: 9.5rem minmax(0, 1fr);
      gap: 1rem;
      padding: 16px 0;
      border-bottom: 1px solid var(--rule);
    }
    .spec dt { padding-top: 3px; }
    .spec dd { font-weight: 500; }

    /* ---------- Kontakt ---------- */
    .contact {
      background: var(--ink);
      color: var(--paper);
      border-top: 0;
      padding-bottom: clamp(32px, 4vw, 48px);
      --rule: rgba(242, 240, 234, 0.16);
    }
    .contact .label { color: rgba(242, 240, 234, 0.5); }
    .contact .sec-num { color: #8EA2FF; }

    .mail-row { display: flex; align-items: baseline; gap: 1rem 1.5rem; flex-wrap: wrap; }
    .big-link {
      font-size: clamp(26px, 4.6vw, 72px);
      font-weight: 600;
      letter-spacing: -0.04em;
      line-height: 1.1;
      text-decoration: none;
      overflow-wrap: anywhere;
      background: linear-gradient(currentColor, currentColor) left bottom / 0% 2px no-repeat;
      transition: background-size 0.6s var(--ease);
      padding-bottom: 0.06em;
    }
    .big-link:hover { background-size: 100% 2px; }

    .copy {
      appearance: none; cursor: pointer;
      font: inherit; font-size: 13px; font-weight: 600;
      color: var(--paper);
      background: transparent;
      border: 1px solid rgba(242, 240, 234, 0.3);
      border-radius: 999px;
      padding: 7px 14px;
      transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
    }
    .copy:hover { background: var(--paper); color: var(--ink); border-color: var(--paper); }

    .phone { margin-top: clamp(18px, 2vw, 28px); }
    .phone .big-link { font-size: clamp(22px, 2.6vw, 40px); color: rgba(242, 240, 234, 0.72); }
    .phone .big-link:hover { color: var(--paper); }

    footer {
      margin-top: clamp(96px, 12vw, 160px);
      padding-top: 22px;
      border-top: 1px solid var(--rule);
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      font-size: 13px;
      color: rgba(242, 240, 234, 0.5);
    }
    footer a { text-decoration: none; }
    footer a:hover { color: var(--paper); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/SplitText.min.js" defer></script>
  <script src="https://unpkg.com/lenis@1.3.4/dist/lenis.min.js" defer></script>
</head>

  <main>
    <!-- HERO -->
    <section id="home" class="hero">
      <div class="hero-kicker label">
        <span data-de="Bewerbung für eine Lehrstelle" data-en="Application for an apprenticeship"></span>
        <span data-de="Schweiz · 2026" data-en="Switzerland · 2026"></span>

      <h1 class="hero-name">Saif<img src="SaifAbdullah2.png" alt="" class="portrait" width="300" height="300"><br>Abdullah</h1>

      <div>
        <dl class="meta grid">
          <span class="meta-rule" aria-hidden="true"></span>

          </div>
          <div>

    <!-- 01 ÜBER MICH -->
    <section id="ueber" class="sec grid">
      <div class="sec-head">
        <span class="sec-num">01</span>
        <span class="label" data-de="Über mich" data-en="About me"></span>

      <div class="sec-body">
        <div class="prose" id="text-ueber"></div>

          <img src="unterschrift.png" alt="Unterschrift Saif Abdullah" width="263" height="200">
          <span class="label">Saif Abdullah</span>
        </div>
      </div>

    <!-- 02 PRAKTIKUM -->
    <section id="praktikum" class="sec grid">
      <div class="sec-head">
        <span class="sec-num">02</span>
        <span class="label" data-de="Praktikum" data-en="Internship"></span>
      </div>
      <div class="sec-body">

let currentLang = "de";

function baueText(absaetze, spalten) {
  const lead = absaetze.filter(a => typeof a === "object" && a.lead !== undefined)
                       .map(a => '<p class="lead">' + a.lead + "</p>").join("");
  const rest = absaetze.filter(a => typeof a === "string").map(a => "<p>" + a + "</p>").join("");
  return lead + (spalten ? '<div class="prose-cols">' + rest + "</div>" : rest);
}

function baueStaerken(liste) {
  return liste.map((k, i) =>
    '<li class="s-row"><span class="rule" aria-hidden="true"></span>'
    + '<span class="s-num">' + String(i + 1).padStart(2, "0") + "</span>"
    + '<div class="s-body"><h3 class="s-title">' + k.t + '</h3><p class="s-text">' + k.p + "</p></div></li>"
  ).join("");
}

function baueWeg(liste) {
  return '<span class="weg-track" aria-hidden="true"><span class="weg-fill"></span></span>'
    + liste.map(s =>
      '<li class="weg-item' + (s.jetzt ? " now" : "") + (s.ziel ? " goal" : "") + '">'
      + '<span class="dot" aria-hidden="true"></span>'
      + (s.w ? '<p class="weg-when label">' + s.w + "</p>" : "")
      + "<h3>" + s.t + "</h3><p>" + s.p + "</p></li>"
    ).join("");
}

function baueAufgaben(gruppen) {
  return gruppen.map(g =>
    '<div class="task-group"><h3>' + g.t + "<small>" + String(g.punkte.length).padStart(2, "0") + "</small></h3><ul>"
    + g.punkte.map(p => "<li>" + p + "</li>").join("") + "</ul></div>"
  ).join("");
}

function setLang(lang) {
  currentLang = lang;
  if (window.Motion) Motion.beforeContent();

  document.documentElement.lang = lang;

  document.querySelectorAll("[data-de][data-en]").forEach(el => {
    const val = el.getAttribute("data-" + lang);
    if (val !== null) el.innerHTML = val;
  });

  document.getElementById("text-ueber").innerHTML     = baueText(TEXTE.ueber[lang], true);
  document.getElementById("text-projekt").innerHTML   = baueText(TEXTE.projekt[lang], false);
  document.getElementById("cards-staerken").innerHTML = baueStaerken(TEXTE.staerken[lang]);
  document.getElementById("list-weg").innerHTML       = baueWeg(TEXTE.weg[lang]);

  const pr = TEXTE.praktikum[lang];
  document.getElementById("text-praktikum").innerHTML  = pr.intro;
  document.getElementById("when-praktikum").innerHTML  = pr.zeit;
  document.getElementById("tasks-praktikum").innerHTML = baueAufgaben(pr.gruppen);
  document.getElementById("tools-praktikum").innerHTML = TEXTE.praktikum.tools.map(t => "<li>" + t + "</li>").join("");

  document.getElementById("btn-de").classList.toggle("active", lang === "de");
  document.getElementById("btn-en").classList.toggle("active", lang === "en");

  if (window.Motion) Motion.afterContent();
}

/* ==========================================================================
   Bewegung: GSAP + ScrollTrigger + SplitText, Lenis für weiches Scrollen
   ========================================================================== */
window.addEventListener("DOMContentLoaded", function () {
  const root = document.documentElement;
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  if (!window.gsap || !window.ScrollTrigger || !window.SplitText || reduced) {
    root.classList.remove("js");
    bindAnchors(null);
    return;
  }

  gsap.registerPlugin(ScrollTrigger, SplitText);

  /* Lenis an den GSAP-Takt hängen, damit ScrollTrigger synchron bleibt */
  let lenis = null;
  if (window.Lenis) {
    lenis = new Lenis({ lerp: 0.09, wheelMultiplier: 1 });
    lenis.on("scroll", ScrollTrigger.update);
    gsap.ticker.add(t => lenis.raf(t * 1000));
    gsap.ticker.lagSmoothing(0);
  }
  bindAnchors(lenis);

  let dynamicCtx = null;

  /* Teile, die bei jedem Sprachwechsel neu gebaut werden */
  function buildDynamic() {
    dynamicCtx = gsap.context(() => {
      // Lead-Absatz: Wörter füllen sich beim Scrollen mit Tinte
      const lead = document.querySelector("#text-ueber .lead");
      if (lead) {
        const split = SplitText.create(lead, { type: "words" });
        gsap.fromTo(split.words, { opacity: 0.16 }, {
          opacity: 1, ease: "none", stagger: 0.1,
          scrollTrigger: { trigger: lead, start: "top 82%", end: "bottom 50%", scrub: true }
        });
      }

      // Werdegang: Linie füllt sich, Punkte gehen an
      const weg = document.getElementById("list-weg");
      gsap.fromTo(weg.querySelector(".weg-fill"), { scaleY: 0 }, {
        scaleY: 1, ease: "none",
        scrollTrigger: { trigger: weg, start: "top 65%", end: "bottom 65%", scrub: true }
      });
      weg.querySelectorAll(".weg-item").forEach(item => {
        ScrollTrigger.create({ trigger: item, start: "top 65%", endTrigger: "html", end: "bottom bottom", toggleClass: { targets: item, className: "on" } });
      });
    });
  }

  window.Motion = {
    beforeContent() { if (dynamicCtx) dynamicCtx.revert(); },
    afterContent()  { buildDynamic(); ScrollTrigger.refresh(); }
  };

  document.fonts.ready.then(() => {
    root.classList.remove("js");
    gsap.set(".hero", { visibility: "visible" });

    /* ---- Intro ---- */
    const name = SplitText.create(".hero-name", { type: "lines", mask: "lines" });
    gsap.timeline({ defaults: { ease: "expo.out" } })
      .from(name.lines, { yPercent: 105, duration: 1.5, stagger: 0.12 })
      .from(".hero-name .portrait", { scale: 0, rotate: -40, duration: 1.4, ease: "back.out(1.4)" }, 0.35)
      .from(".hero-kicker > *", { y: 14, autoAlpha: 0, duration: 1, stagger: 0.08 }, 0.2)
      .from(".meta-rule", { scaleX: 0, duration: 1.6, ease: "expo.inOut" }, 0.3)
      .from(".meta > div", { y: 22, autoAlpha: 0, duration: 1.1, stagger: 0.07 }, 0.75)
      .from(".hero-foot > *", { y: 22, autoAlpha: 0, duration: 1.1, stagger: 0.1 }, 0.9);

    /* Name schiebt sich beim Wegscrollen leicht nach oben */
    gsap.to(".hero-name", {
      yPercent: -18, ease: "none",
      scrollTrigger: { trigger: ".hero", start: "top top", end: "bottom top", scrub: true }
    });

    /* ---- Einblenden ---- */
    gsap.utils.toArray(".reveal").forEach(el => {
      gsap.from(el, {
        y: 40, autoAlpha: 0, duration: 1.2, ease: "expo.out",
        scrollTrigger: { trigger: el, start: "top 88%", once: true }
      });
    });

    gsap.utils.toArray(".prose-cols p").forEach(p => {
      gsap.from(p, {
        y: 28, autoAlpha: 0, duration: 1.1, ease: "expo.out",
        scrollTrigger: { trigger: p, start: "top 90%", once: true }
      });
    });

    /* Stärken: Linien zeichnen sich, Zeilen steigen auf */
    gsap.utils.toArray(".s-row").forEach(row => {
      gsap.timeline({ scrollTrigger: { trigger: row, start: "top 86%", once: true } })
        .from(row.querySelector(".rule"), { scaleX: 0, duration: 1.3, ease: "expo.inOut" })
        .from(row.querySelectorAll(".s-num, .s-title, .s-text"),
              { y: 26, autoAlpha: 0, duration: 1, ease: "expo.out", stagger: 0.07 }, 0.25);
    });

    /* Praktikum: Aufgabengruppen und Punkte */
    gsap.utils.toArray(".task-group").forEach(g => {
      gsap.timeline({ scrollTrigger: { trigger: g, start: "top 86%", once: true } })
        .from(g.querySelector("h3"), { y: 24, autoAlpha: 0, duration: 1, ease: "expo.out" })
        .from(g.querySelectorAll("li"), { y: 16, autoAlpha: 0, duration: 0.9, ease: "expo.out", stagger: 0.06 }, 0.15);
    });

    /* Unterschrift wird von links nach rechts "geschrieben" */
    gsap.fromTo(".signature img", { clipPath: "inset(0 100% 0 0)" }, {
      clipPath: "inset(0 0% 0 0)", duration: 1.8, ease: "power2.inOut",
      scrollTrigger: { trigger: ".signature", start: "top 88%", once: true }
    });

    /* Aktiver Menüpunkt */
    const links = document.querySelectorAll(".nav-links a");
    ["ueber", "praktikum", "weg", "staerken", "projekt", "kontakt"].forEach(id => {
      ScrollTrigger.create({
        trigger: "#" + id, start: "top 50%", end: "bottom 50%",
        onToggle: self => {
          if (self.isActive) links.forEach(a => a.classList.toggle("active", a.getAttribute("href") === "#" + id));
          else if (id === "ueber" && self.direction < 0) links.forEach(a => a.classList.remove("active"));
        }
      });
    });

    buildDynamic();
    ScrollTrigger.refresh();
  });

  function bindAnchors(lenis) {
    document.querySelectorAll('a[href^="#"]').forEach(a => {
      a.addEventListener("click", e => {
        const target = document.querySelector(a.getAttribute("href"));
        if (!target) return;
        e.preventDefault();
        if (lenis) lenis.scrollTo(target, { offset: target.id === "home" ? 0 : -8, duration: 1.4 });
        else target.scrollIntoView({ behavior: reduced ? "auto" : "smooth" });
      });
    });
  }
});
