      padding: 6rem 22px 7rem;

      overflow: hidden;
      isolation: isolate;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: -20%;
      z-index: -2;
      background:
        radial-gradient(closest-side at 50% 22%, rgba(70, 120, 220, 0.30), transparent 70%),

        radial-gradient(closest-side at 84% 70%, rgba(0, 140, 200, 0.20), transparent 70%),
        linear-gradient(180deg, #05070d 0%, #0a0d16 45%, #000 100%);
      animation: drift 22s ease-in-out infinite alternate;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px) 0 0 / 100% 76px,
        linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px) 0 0 / 76px 100%;
      mask-image: radial-gradient(closest-side at 50% 45%, #000 35%, transparent 100%);
      -webkit-mask-image: radial-gradient(closest-side at 50% 45%, #000 35%, transparent 100%);
      opacity: 0.7;
    }

    @keyframes drift {
      from { transform: translate3d(-1.5%, -1%, 0) scale(1.02); }
      to   { transform: translate3d(1.5%, 1.5%, 0) scale(1.06); }
    }

      position: relative;
      display: grid;
      place-items: center;
      margin-bottom: 2.6rem;
    }

    .portrait-frame::before,

      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.14);

    .portrait-frame::before { inset: -18px; }
    .portrait-frame::after  { inset: -40px; border-color: rgba(255,255,255,0.07); }

    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; transform: none; transition: none; }

  </style>

  return absaetze.map(a => {
    if (typeof a === "string") return "<p>" + a + "</p>";
    if (a.lead !== undefined)  return '<p class="lead">' + a.lead + "</p>";
    return "";

}

function baueKarten(karten) {
  return karten.map((k, i) =>
    '<div class="card"><div class="num">' + String(i + 1).padStart(2, "0") + '</div>'
    + "<h3>" + k.t + "</h3><p>" + k.p + "</p></div>"
  ).join("");
}

function setLang(lang) {
  document.documentElement.lang = lang;
  document.title = "Saif Abdullah";

  document.querySelectorAll("[data-de][data-en]").forEach(el => {
    const val = el.getAttribute("data-" + lang);
    if (val !== null) el.innerHTML = val;
  });

  document.getElementById("text-ueber").innerHTML     = baueText(TEXTE.ueber[lang]);
  document.getElementById("text-projekt").innerHTML   = baueText(TEXTE.projekt[lang]);
  document.getElementById("cards-staerken").innerHTML = baueKarten(TEXTE.staerken[lang]);

  document.getElementById("btn-de").classList.toggle("active", lang === "de");
  document.getElementById("btn-en").classList.toggle("active", lang === "en");
}

setLang("de");

(function () {
  const els = document.querySelectorAll(".reveal");
  if (!("IntersectionObserver" in window)) {
    els.forEach(el => el.classList.add("in"));
    return;
  }
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
    });
  }, { threshold: 0.12, rootMargin: "0px 0px -60px 0px" });
  els.forEach(el => io.observe(el));
})();
</script>
